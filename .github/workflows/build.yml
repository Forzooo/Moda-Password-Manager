# This workflow builds and tests the project with the LTS JDKs: 21, 25 to ensure compatibility over multiple versions of Java.
name: Project build and test on multiple JDKs

on:
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        jdk: [21, 25]

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up JDK ${{ matrix.jdk}}
      uses: actions/setup-java@v6.2.0
      with:
        java-version: ${{ matrix.jdk}}
        distribution: 'temurin'
        cache: gradle

    - name: Build and test with Gradle
      run: ./gradlew build
